<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generar Reportes</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="reportes.css">
</head>
<body>

    <header class="top-bar">
        <a href="index.html" class="brand">
            <img src="Gemini_Generated_Image_4melx84melx84mel.png" alt="Logo">
            <span>Academic Management System</span>
        </a>
        <a href="index.html" class="home-button">Inicio</a>
    </header>

    <main class="reportes-page">

        <section class="reportes-hero">
            <h1>Generar Reportes</h1>
            <p>Selecciona qué quieres consultar y genera la tabla con el detalle de todas tus materias.</p>
        </section>

        <section class="reportes-form">
            <select id="selectTipoReporte">
                <option value="Período 1">Período 1</option>
                <option value="Período 2">Período 2</option>
                <option value="Período 3">Período 3</option>
                <option value="Período 4">Período 4</option>
                <option value="general">Promedio general (los 4 períodos)</option>
            </select>
            <button id="btnGenerar">Generar</button>
        </section>

        <section id="reporteResultado" class="reporte-resultado">
            <!-- La tabla se genera aquí -->
        </section>

    </main>

    <script src="reportes.js"></script>

</body>
</html>
